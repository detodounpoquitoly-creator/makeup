function labelFromKey(key) {
  var p = key.split("-").map(Number);
  var dt = new Date(p[0], p[1]-1, p[2]);
  return DIAS[dt.getDay()] + ", " + p[2] + " de " + MESES[p[1]-1] + " de " + p[0];
}
function shortLabel(key) {

function busy(dateKey, slot) {
  var h = 0, s = dateKey + slot;

}

/* ============ BACKEND (API REST) ============ */

function apiBase() { return (S.site.sync.endpoint || "").replace(/\/$/, ""); }
function apiPull(ep) {
  var base = ep.replace(/\/$/, "");
  return fetch(base + "/config", { headers: { Accept: "application/json" } }).then(function(r) {
    if (!r.ok) throw new Error("GET /config → " + r.status);
    return r.json();
  }).then(function(config) {
    return fetch(base + "/reservas", { headers: { Accept: "application/json" } }).then(function(r) {
      if (!r.ok) return { config: config, reservas: null };
      return r.json().then(function(res) { return { config: config, reservas: res }; }, function() { return { config: config, reservas: null }; });
    });
  });
}
function apiPush(ep, site, rows) {
  var base = ep.replace(/\/$/, "");
  return Promise.all([
    fetch(base + "/config", { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(site) }),
    fetch(base + "/reservas", { method:"PUT", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(rows) })
  ]).then(function(rs) {
    if (!rs[0].ok || !rs[1].ok) throw new Error("PUT → " + rs[0].status + " / " + rs[1].status);
  });
}
function apiPushReserva(row) {
  var base = apiBase();
  if (!base) return;
  try { fetch(base + "/reservas", { method:"POST", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(row) }).catch(function(){}); } catch (e) {}
}

function getPath(path) {
  var parts = path.split("."), cur = S;
  for (var i = 0; i < parts.length; i++) {
    var k = parts[i];
    cur = cur[k];
    if (cur == null) return undefined;
  }
  return cur;
}
function setPath(path, value) {
  var parts = path.split("."), cur = S;
  for (var i = 0; i < parts.length - 1; i++) cur = cur[parts[i]];
  var last = parts[parts.length - 1];
  var isNum = /^-?\d+$/.test(last);
  if (isNum) cur[Number(last)] = value; else cur[last] = value;
}

/* ---- RESERVA ---- */

function bookProgress(step) {
  var names = ["Servicio","Detalle","Turno","Datos"], out = "";
  for (var i = 0; i < 4; i++) {
    out += '<div><div class="bar' + (i + 1 <= step ? " on" : "") + '"></div><p class="cap' + (i + 1 === step ? " on" : "") + '">' + names[i] + "</p></div>";
  }
  return '<div class="progress">' + out + "</div>";
}

function viewBooking() {
  var b = S.book;
  if (b.done) return viewSuccess();
  var back = b.step === 1
    ? (b.catId ? 'data-act="pickcat" data-cat=""' : 'data-act="go" data-view="servicios"')
    : 'data-act="bkback"';
  var head = '<div class="bk-head"><button class="backlink" ' + back + ">" + IC.back + " Volver</button>" +
    '<p class="steplabel">PASO ' + b.step + " DE 4</p></div>" + bookProgress(b.step);
  var body = "";
  if (b.step === 1 && !b.catId) body = bkStep1a();
  if (b.step === 1 && b.catId) body = bkStep1b();
  if (b.step === 2) body = bkStep2();
  if (b.step === 3) body = bkStep3();
  if (b.step === 4) body = bkStep4();
  return '<div class="bk fade-in">' + head + body + "</div>";
}

function bkStep1a() {
  var opts = S.site.catalog.map(function(c) {
    return '<button class="opt" data-act="pickcat" data-cat="' + esc(c.id) + '">' +
      '<span class="nm">' + esc(c.name) + '</span><span style="margin-left:auto;display:flex;gap:.5rem;align-items:center" class="muted">' + c.services.length + " servicios " + IC.arrow + "</span></button>";
  }).join("");
  return '<h2 class="display">Elegí tu servicio</h2><p class="sub">¿Qué te gustaría reservar?</p><div class="stack">' + opts + "</div>";
}

function bkStep1b() {
  var cat = S.site.catalog.filter(function(c){ return c.id === S.book.catId; })[0];
  var opts = cat.services.map(function(s) {
    var sel = S.book.svcId === s.id;
    return '<button class="opt' + (sel ? " sel" : "") + '" data-act="picksvc" data-svc="' + esc(s.id) + '">' +
      '<span class="radio"></span><span style="flex:1"><span class="nm">' + esc(s.name) + '</span>' +
      '<span class="meta" style="display:block">' + fmtDur(s.dur) + " · desde " + money(s.price) + " · seña " + money(senaOf(s.price)) + "</span></span></button>";
  }).join("");
  return '<h2 class="display">' + esc(cat.name) + '</h2>' +
    '<p class="sub">Elegí el servicio y su duración · <button style="text-decoration:underline" data-act="pickcat" data-cat="">cambiar categoría</button></p>' +
    '<div class="stack">' + opts + "</div>" +
    '<button class="btn btn-pri btn-block" style="margin-top:1.5rem" ' + (S.book.svcId ? 'data-act="bkstep" data-step="2"' : "disabled") + ">CONTINUAR " + IC.arrow + "</button>";
}

function bkStep2() {
  var cat = S.site.catalog.filter(function(c){ return c.id === S.book.catId; })[0];
  var s = cat.services.filter(function(x){ return x.id === S.book.svcId; })[0];
  var c = S.site.contact;
  return '<h2 class="display">' + esc(s.name) + "</h2>" +
    '<p class="sub" style="display:flex;gap:.5rem;align-items:center">' + IC.clock + " " + fmtDur(s.dur) + " · Seña " + money(senaOf(s.price)) + " · Total " + money(s.price) + "</p>" +
    '<p class="body-txt" style="margin-bottom:1.5rem">' + esc(s.desc) + "</p>" +
    '<div class="card" style="padding:1.25rem;margin-bottom:1.5rem"><p class="lbl" style="display:flex;gap:.5rem;align-items:center">' + IC.pin + " EN EL ESTUDIO</p>" +
    '<p style="font-weight:600;color:var(--ink)">' + esc(c.addr) + '</p><p class="muted" style="margin-top:.25rem">' + esc(c.hours) + " · " + esc(c.note) + "</p></div>" +
    '<button class="btn btn-pri btn-block" data-act="bkstep" data-step="3">CONTINUAR ' + IC.arrow + "</button>";
}

function bkStep3() {
  var today = new Date(); today.setHours(0,0,0,0);
  var base = new Date(today.getFullYear(), today.getMonth(), 1);
  var vd = new Date(base.getFullYear(), base.getMonth() + S.calOff, 1);
  var y = vd.getFullYear(), m = vd.getMonth();
  var lead = (new Date(y, m, 1).getDay() + 6) % 7;
  var dim = new Date(y, m + 1, 0).getDate();
  var html = '<h2 class="display">Turnos</h2><p class="sub">Elegí el día y el horario</p>' +
    '<div class="card" style="padding:1.25rem;margin-bottom:1.25rem">' +
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">' +
    '<button class="btn btn-sm btn-out" style="border-radius:50%;padding:.5rem .65rem"' + (S.calOff > 0 ? ' data-act="calmove" data-d="-1"' : " disabled") + ">" + IC.back + "</button>" +
    '<p style="font-weight:600;text-transform:capitalize">' + MESES[m] + " " + y + "</p>" +
    '<button class="btn btn-sm btn-out" style="border-radius:50%;padding:.5rem .65rem" data-act="calmove" data-d="1">' + IC.arrow + "</button></div>" +
    '<div class="cal-grid">' + ["L","M","M","J","V","S","D"].map(function(d){ return '<span class="dow">' + d + "</span>"; }).join("");
  for (var i = 0; i < lead; i++) html += "<span></span>";
  for (var d = 1; d <= dim; d++) {
    var dt = new Date(y, m, d);
    var off = dt < today || dt.getDay() === 0;
    var sel = S.book.dateKey === dateKeyOf(y, m, d);
    html += '<button class="cal-day' + (sel ? " sel" : "") + '"' + (off ? " disabled" : ' data-act="picksday" data-key="' + dateKeyOf(y, m, d) + '"') + ">" + d + "</button>";
  }
  html += "</div></div>";
  if (S.book.dateKey) {
    html += '<p class="muted" style="text-transform:capitalize;margin-bottom:.75rem">' + labelFromKey(S.book.dateKey) + '</p><div class="slot-grid">';
    SLOTS.forEach(function(t) {
      var occ = busy(S.book.dateKey, t), sel = S.book.time === t;
      html += '<button class="slot' + (sel ? " sel" : "") + '"' + (occ ? " disabled" : ' data-act="pickslot" data-t="' + t + '"') + ">" + t + "</button>";
    });
    html += "</div>";
  } else {
    html += '<p class="muted" style="background:#F3EEE8;border-radius:.75rem;padding:.75rem 1rem;margin-bottom:1.25rem">Primero elegí un día del calendario 👆</p>';
  }
  html += '<p class="hold">🔒 Te bloqueamos el horario por 1 hora para completar la reserva.</p>' +
    '<button class="btn btn-pri btn-block" ' + (S.book.time ? 'data-act="bkstep" data-step="4"' : "disabled") + ">CONTINUAR " + IC.arrow + "</button>";
  return html;
}

function bkStep4() {
  var b = S.book;
  var cat = S.site.catalog.filter(function(c){ return c.id === b.catId; })[0];
  var s = cat.services.filter(function(x){ return x.id === b.svcId; })[0];
  var dig = function(v){ return String(v || "").replace(/\D/g, ""); };
  var valid = b.name.trim().length >= 3 && dig(b.phone).length >= 8 && dig(b.phone) === dig(b.phone2);
  var F = function(label, key, ph, hint, type) {
    return '<div style="margin-bottom:1rem"><label class="lbl">' + label + '</label>' +
      '<input class="input" type="' + (type || "text") + '" value="' + esc(b[key]) + '" placeholder="' + esc(ph) + '" data-bind="book.' + key + '">' +
      (hint ? '<p class="muted" style="margin-top:.25rem">' + hint + "</p>" : "") + "</div>";
  };
  return '<h2 class="display">Cargá tus datos</h2><p class="sub">Y te mandamos un WhatsApp con todo lo necesario para pagar la seña y confirmar tu reserva.</p>' +
    '<div class="card" style="padding:1.25rem;margin-bottom:1.5rem"><p style="font-weight:600;color:var(--ink)">' + esc(s.name) + "</p>" +
    '<p class="muted" style="text-transform:capitalize;margin-top:.15rem">' + labelFromKey(b.dateKey) + " — " + b.time + "</p>" +
    '<div style="border-top:1px solid #F0EBE3;margin-top:1rem;padding-top:1rem;display:flex;justify-content:space-between;align-items:center">' +
    '<p class="lbl" style="margin:0">TOTAL</p><p style="text-align:right"><span style="font-weight:600;font-size:1.1rem;color:var(--ink)">' + money(s.price) +
    '</span><span class="muted" style="display:block">seña ' + money(senaOf(s.price)) + " · " + fmtDur(s.dur) + "</span></p></div></div>" +
    F("NOMBRE Y APELLIDO", "name", "Tu nombre completo") +
    F("TELÉFONO (WHATSAPP)", "phone", "+54 9 11 ...", "Te vamos a escribir por WhatsApp para completar la reserva.", "tel") +
    F("CONFIRMÁ TU TELÉFONO", "phone2", "+54 9 11 ...", null, "tel") +
    F("INSTAGRAM (OPCIONAL)", "ig", "@tuusuario") +
    (!valid ? '<p style="font-size:12px;color:#B0644F;margin-bottom:1rem">Revisá los campos: nombre completo, teléfono válido y que ambos números coincidan.</p>' : "") +
    '<button class="btn btn-pri btn-block" ' + (valid ? 'data-act="confirm"' : "disabled") + ">CONFIRMAR RESERVA</button>";
}

function viewSuccess() {
  var r = S.book.done;
  return '<div class="bk fade-in" style="text-align:center;padding-top:3.5rem">' +
    '<div style="width:80px;height:80px;margin:0 auto 1.5rem;border-radius:50%;background:var(--pri);display:flex;align-items:center;justify-content:center;color:#fff">' + IC.check + "</div>" +
    '<h2 class="display" style="font-size:2.2rem;margin-bottom:.5rem">¡Reserva registrada!</h2>' +
    '<p class="body-txt">Código <b>' + esc(r.code) + '</b></p>' +
    '<p class="muted" style="text-transform:capitalize;margin-bottom:2rem">' + labelFromKey(r.dateKey) + " — " + r.time + "</p>" +
    '<div class="card" style="padding:1.25rem;text-align:left;margin-bottom:2rem"><p style="font-weight:600;color:var(--ink)">' + esc(r.service) + "</p>" +
    '<p class="muted" style="margin-top:.15rem">A nombre de ' + esc(r.name) + "</p>" +
    '<div style="border-top:1px solid #F0EBE3;margin-top:1rem;padding-top:1rem;display:flex;justify-content:space-between;align-items:center">' +
    '<span class="lbl" style="margin:0">SEÑA A PAGAR</span><span style="font-weight:600;font-size:1.1rem;color:var(--ink)">' + money(r.sena) + "</span></div></div>" +
    '<p class="body-txt" style="margin-bottom:2rem">Te vamos a escribir por WhatsApp con todo lo necesario para pagar la seña y confirmar tu reserva. 💄</p>' +
    '<button class="btn btn-pri btn-block" data-act="success-done" data-view="reservas">VER MIS RESERVAS</button>' +
    '<button class="btn btn-out btn-block" style="margin-top:.75rem" data-act="success-done" data-view="servicios">VOLVER AL INICIO</button></div>';
}

/* ---- MIS RESERVAS ---- */

function resCards(admin) {
  if (!S.rows.length) {
    return '<div class="card" style="text-align:center;padding:4rem 1rem"><p class="muted" style="margin-bottom:1.25rem">Todavía no hay reservas.</p>' +
      (admin ? "" : '<button class="btn btn-pri" data-act="reservar">RESERVAR TURNO ' + IC.arrow + "</button>") + "</div>";
  }
  var wl = waLink();
  return S.rows.map(function(r) {
    var cancel = r.status !== "Cancelada";
    return '<div class="card res-card' + (cancel ? "" : " cancelled") + '">' +
      '<div class="res-top"><div><p style="font-weight:600;color:var(--ink)">' + esc(r.service) + "</p>" +
      '<p class="muted" style="text-transform:capitalize;margin-top:.15rem">' + labelFromKey(r.dateKey) + " — " + r.time + "</p></div>" +
      '<span class="badge ' + (cancel ? "ok" : "no") + '">' + esc(r.status.toUpperCase()) + "</span></div>" +
      '<div class="res-meta"><span><b style="color:#5C5248">' + esc(r.name) + "</b> · " + esc(r.phone) + "</span>" +
      "<span>" + esc(r.ig || "—") + " · Código " + esc(r.code) + "</span>" +
      '<span style="color:var(--pri);font-weight:600">' + money(r.total) + " · seña " + money(r.sena) + "</span></div>" +
      '<div class="res-actions"><a class="link-wa" href="' + wl + "?text=" + encodeURIComponent("Hola " + S.site.brand + "! Consulto por mi reserva " + r.code + " (" + r.service + ", " + shortLabel(r.dateKey) + " " + r.time + ").") + '" target="_blank" rel="noreferrer">' + IC.waS + " CONSULTAR</a>" +
      (cancel ? '<button class="link-danger" data-act="cancelres" data-code="' + esc(r.code) + '" style="margin-left:auto">CANCELAR</button>' : "") +
      (admin ? '<button class="link-danger' + (S.arm === "res:" + r.code ? " armed" : "") + '" data-act="delres" data-code="' + esc(r.code) + '">' + IC.trash + (S.arm === "res:" + r.code ? " ¿CONFIRMAR?" : " BORRAR") + "</button>" : "") +
      "</div></div>";
  }).join('<div style="height:.75rem"></div>');
}

function viewReservas(admin) {
  var actives = S.rows.filter(function(r){ return r.status !== "Cancelada"; }).length;
  return '<div class="bk fade-in" style="padding-top:2.5rem"><p class="kicker">AGENDA</p>' +
    '<h2 class="display" style="font-size:2.2rem;margin-bottom:1.5rem">' + (admin ? "Gestión de reservas" : "Mis reservas") + "</h2>" +
    (S.rows.length ? '<p class="muted" style="margin-bottom:1rem">' + actives + " activa" + (actives === 1 ? "" : "s") + "</p>" : "") +
    resCards(admin) + "</div>";
}

/* ---- EDICIÓN ---- */

var ED_TABS = [["portada","PORTADA"],["servicios","SERVICIOS"],["trabajos","TRABAJOS"],["sobre","SOBRE MÍ"],["contacto","CONTACTO"],["diseno","DISEÑO"],["reservas","RESERVAS"],["datos","DATOS Y BACKEND"]];

function fld(label, bind, value, opts) {
  opts = opts || {};
  if (opts.textarea) return '<div style="margin-bottom:1rem"><label class="lbl">' + label + '</label><textarea class="input" data-bind="' + bind + '">' + esc(value) + "</textarea></div>";
  return '<div style="margin-bottom:1rem"><label class="lbl">' + label + '</label><input class="input" type="' + (opts.type || "text") + '" value="' + esc(value) + '" data-bind="' + bind + '"></div>';
}

function photoField(label, bind, value, hues, ratio, artId) {
  var media = value ? '<img src="' + value + '" alt="">' : artSVG(artId, hues);
  return '<div><p class="lbl">' + label + '</p>' +
    '<div class="photo-box" style="aspect-ratio:' + ratio + '">' + media +
    '<label class="photo-overlay"><span>' + IC.cam + (value ? " CAMBIAR FOTO" : " SUBIR FOTO") + '</span><input type="file" accept="image/*" style="display:none" data-photo="' + bind + '"></label></div>' +
    (value ? '<button class="del-photo" data-act="delfoto" data-bind="' + bind + '">Quitar foto (volver al arte de fondo)</button>' : "") + "</div>";
}

function delBtn(act, key, label) {
  var armed = S.arm === key;
  return '<button class="link-danger' + (armed ? " armed" : "") + '" data-act="' + act + '" data-key="' + esc(key) + '">' + IC.trash + " " + (armed ? "¿CONFIRMAR?" : (label || "ELIMINAR")) + "</button>";
}

function viewEditar() {
  var t = S.editTab;
  var tabs = ED_TABS.map(function(x) {
    return '<button class="ed-tab' + (t === x[0] ? " on" : "") + '" data-act="edtab" data-tab="' + x[0] + '">' + x[1] + "</button>";
  }).join("");
  var body = "";
  if (t === "portada") body = edPortada();
  if (t === "servicios") body = edServicios();
  if (t === "trabajos") body = edTrabajos();
  if (t === "sobre") body = edSobre();
  if (t === "contacto") body = edContacto();
  if (t === "diseno") body = edDiseno();
  if (t === "reservas") body = viewReservas(true);
  if (t === "datos") body = edDatos();
  return '<div class="fade-in" style="padding:2rem 0 0">' +
    '<div class="ed-head"><div><p class="kicker">MODO EDICIÓN</p><h2 class="display" style="font-size:2rem">Personalizá tu sitio</h2></div>' +
    '<div style="display:flex;gap:.5rem"><button class="btn btn-sm btn-out" data-act="reservar">PROBAR RESERVA</button>' +
    '<button class="btn btn-sm btn-pri" data-act="go" data-view="servicios">VER SITIO</button></div></div>' +
    '<div class="ed-tabs">' + tabs + "</div>" + body + "</div>";
}

function edPortada() {
  return '<div class="ed-grid"><div>' +
    fld("NOMBRE DE LA MARCA", "site.brand", S.site.brand) +
    '<p class="mini-label" style="margin:-.75rem 0 1rem">Aparece en el logo, ej: Sofy</p>' +
    fld("COMPLEMENTO DEL LOGO", "site.brandSuffix", S.site.brandSuffix) +
    fld("TÍTULO PRINCIPAL", "site.hero.title", S.site.hero.title) +
    fld("TÍTULO DESTACADO", "site.hero.titleAccent", S.site.hero.titleAccent) +
    fld("ETIQUETA SOBRE LA FOTO", "site.hero.photoTag", S.site.hero.photoTag) +
    "</div><div>" +
    fld("FRASE SUPERIOR", "site.hero.kicker", S.site.hero.kicker) +
    fld("TEXTO DE PORTADA", "site.hero.text", S.site.hero.text, { textarea: true }) +
    photoField("FOTO DE PORTADA", "site.hero.photo", S.site.hero.photo, ["#3E2B22","#8A5A44","#DDB9A3"], "4/3", "edit-hero") +

}

function edServicios() {
  var html = S.site.catalog.map(function(c, ci) {
    var svcs = c.services.map(function(s, si) {
      return '<div class="ed-svc">' +
        '<div class="row">' +
        '<div class="grow" style="flex:2 1 200px">' + fld("SERVICIO", "site.catalog." + ci + ".services." + si + ".name", s.name) + "</div>" +
        '<div style="flex:0 0 130px">' + fld("DURACIÓN (MIN)", "site.catalog." + ci + ".services." + si + ".dur", s.dur, { type: "number" }) + "</div>" +
        '<div style="flex:0 0 140px">' + fld("PRECIO $", "site.catalog." + ci + ".services." + si + ".price", s.price, { type: "number" }) + "</div>" +
        "</div>" +
        fld("DESCRIPCIÓN", "site.catalog." + ci + ".services." + si + ".desc", s.desc, { textarea: true }) +
        '<div style="display:flex;justify-content:space-between;align-items:center">' +
        '<span class="mini-label">Seña automática: ' + money(senaOf(s.price)) + " (30%)</span>" +
        delBtn("delsvc", c.id + "|" + s.id) + "</div></div>";
    }).join("");
    return '<div class="card ed-cat"><div class="row">' +
      '<div class="grow">' + fld("CATEGORÍA", "site.catalog." + ci + ".name", c.name) + "</div>" +
      '<div class="grow">' + fld("DESCRIPCIÓN CORTA", "site.catalog." + ci + ".tag", c.tag) + "</div>" +
      '<div style="padding-top:1.25rem">' + delBtn("delcat", c.id, "QUITAR") + "</div></div>" +

      '<button class="btn btn-sm btn-out" style="margin-top:.75rem" data-act="addsvc" data-cat="' + esc(c.id) + '">+ AGREGAR SERVICIO</button></div>';
  }).join("");
  return '<div class="stack">' + html + '<button class="btn btn-sm btn-pri" data-act="addcat">+ NUEVA CATEGORÍA</button></div>';
}

function edTrabajos() {
  var cards = S.site.works.map(function(w, wi) {
    return '<div class="card" style="padding:1rem">' +
      photoField("FOTO", "site.works." + wi + ".photo", w.photo, w.hues, "1/1", "ed-" + w.id) +
      '<div style="margin-top:.75rem">' +
      fld("TÍTULO", "site.works." + wi + ".label", w.label) +

}

function edSobre() {
  var a = S.site.about;
  var stats = a.stats.map(function(st, i) {
    return '<div class="row" style="margin-bottom:.75rem">' +
      '<div style="flex:0 0 120px"><input class="input" value="' + esc(st.n) + '" data-bind="site.about.stats.' + i + '.n" placeholder="+150"></div>' +
      '<div class="grow"><input class="input" value="' + esc(st.l) + '" data-bind="site.about.stats.' + i + '.l" placeholder="novias"></div></div>';
  }).join("");
  return '<div class="ed-grid"><div>' +
    fld("TÍTULO", "site.about.title", a.title) +
    fld("PÁRRAFO 1", "site.about.p1", a.p1, { textarea: true }) +
    fld("PÁRRAFO 2", "site.about.p2", a.p2, { textarea: true }) +
    '<p class="lbl">NÚMEROS DESTACADOS</p>' + stats + "</div><div>" +
    photoField("TU FOTO", "site.about.photo", a.photo, ["#2B2320","#6E4A3A","#C9A08C"], "3/4", "edit-sofy") +
    "</div></div>";
}

function edContacto() {
  var c = S.site.contact;
  return '<div class="ed-grid"><div>' +
    fld("WHATSAPP (SÓLO NÚMEROS, CON CÓDIGO PAÍS)", "site.contact.wa", c.wa) +
    '<p class="mini-label" style="margin:-.75rem 0 1rem">Ej: 5491123456789 — el botón flotante usa este número.</p>' +

    fld("DIRECCIÓN DEL ESTUDIO", "site.contact.addr", c.addr) +
    fld("HORARIOS", "site.contact.hours", c.hours) +
    fld("NOTA DE ESTUDIO", "site.contact.note", c.note) +
    "</div></div>";
}

function edDiseno() {
  var presets = [["#4B3621","#FAF8F5","Marrón clásico"],["#8A5A44","#FAF6F2","Caramelo"],["#1A1512","#F7F5F2","Negro blanco"],["#7A2E3A","#FBF6F4","Vino"],["#3E4A3B","#F5F7F4","Verde oliva"],["#2F3A4C","#F4F6F9","Azul noche"]];
  var sw = presets.map(function(p) {
    return '<button class="swatch" data-act="palette" data-p="' + p[0] + '" data-b="' + p[1] + '"><span class="p" style="background:' + p[0] + '"></span><span class="b" style="background:' + p[1] + '"></span>' + p[2] + "</button>";
  }).join("");
  return '<div style="max-width:30rem"><p class="body-txt" style="margin-bottom:1.25rem">Color principal (botones y acentos) y color de fondo del sitio.</p>' +
    '<div class="card" style="padding:1.25rem;margin-bottom:1.25rem">' +
    '<p class="lbl">COLOR PRINCIPAL</p><div style="display:flex;gap:.75rem;align-items:center">' +
    '<input type="color" value="' + esc(S.site.theme.primary) + '" data-bind-color="site.theme.primary" style="width:48px;height:40px;border:1px solid #E4DCD2;border-radius:.5rem;background:none;cursor:pointer">' +
    '<input class="input" value="' + esc(S.site.theme.primary) + '" data-bind="site.theme.primary"></div>' +
    '<p class="lbl" style="margin-top:1.25rem">COLOR DE FONDO</p><div style="display:flex;gap:.75rem;align-items:center">' +
    '<input type="color" value="' + esc(S.site.theme.bg) + '" data-bind-color="site.theme.bg" style="width:48px;height:40px;border:1px solid #E4DCD2;border-radius:.5rem;background:none;cursor:pointer">' +
    '<input class="input" value="' + esc(S.site.theme.bg) + '" data-bind="site.theme.bg"></div></div>' +
    '<p class="lbl">PALETAS LISTAS</p><div class="swatches">' + sw + "</div></div>";
}

function edDatos() {
  var bytes = 0;
  try {
    bytes = (localStorage.getItem(KEY_SITE) || "").length + (localStorage.getItem(KEY_RES) || "").length;
  } catch (e) {}
  var pct = Math.min(100, Math.round((bytes / (5 * 1024 * 1024)) * 100));
  var st = S.syncStatus, cls = st.indexOf("✅") === 0 ? "status-ok" : st.indexOf("❌") === 0 ? "status-err" : "status-info";
  return '<div style="max-width:30rem">' +
    '<div class="card" style="padding:1.25rem;margin-bottom:1.25rem"><p class="lbl">ALMACENAMIENTO LOCAL</p>' +
    '<p class="body-txt" style="font-size:13px;margin-bottom:.75rem">Todo lo que editás se guarda automáticamente en este dispositivo. Las fotos subidas ocupan espacio.</p>' +
    '<div class="meter"><div style="width:' + Math.max(2, pct) + '%"></div></div>' +
    '<p class="muted">' + Math.round(bytes / 1024) + " KB usados de ~5.000 KB (" + pct + "%)</p></div>" +
    '<div class="card" style="padding:1.25rem;margin-bottom:1.25rem"><p class="lbl">BACKEND (API REST)</p>' +
    '<p class="body-txt" style="font-size:13px;margin-bottom:1rem">Pegá la URL de tu API (ej: <span class="mono">https://tu-api.vercel.app/api</span>). El sitio leerá <span class="mono">/config</span> y <span class="mono">/reservas</span> y subirá los cambios a los mismos endpoints. La interfaz no cambia.</p>' +
    fld("URL DEL BACKEND", "site.sync.endpoint", S.site.sync.endpoint) +
    '<label class="chk"><input type="checkbox" data-bind="site.sync.autoSync"' + (S.site.sync.autoSync ? " checked" : "") + '><span>Al abrir el sitio, bajar automáticamente los datos del backend</span></label>' +
    '<div style="display:flex;gap:.5rem;margin-bottom:.75rem">' +
    '<button class="btn btn-sm btn-out" style="flex:1"' + (S.syncBusy ? " disabled" : "") + ' data-act="pull">DESCARGAR</button>' +
    '<button class="btn btn-sm btn-pri" style="flex:1"' + (S.syncBusy ? " disabled" : "") + ' data-act="push">SUBIR TODO</button></div>' +
    '<p class="mini-label">Cada reserva nueva también se envía sola al backend por POST a /reservas.</p></div>' +
    '<div class="card" style="padding:1.25rem;margin-bottom:1rem"><p class="lbl">RESPALDO (JSON)</p>' +
    '<div style="display:flex;gap:.5rem;margin-bottom:.75rem">' +
    '<button class="btn btn-sm btn-out" style="flex:1" data-act="export">EXPORTAR TODO</button>' +
    '<button class="btn btn-sm btn-out" style="flex:1"' + (S.paste.trim() ? ' data-act="import"' : " disabled") + '>IMPORTAR DE ABAJO</button></div>' +
    '<textarea class="input mono" style="min-height:120px" data-paste placeholder="Pegá acá un respaldo JSON para importarlo…">' + esc(S.paste) + "</textarea>" +
    '<label class="btn btn-sm btn-out" style="margin-top:.75rem;cursor:pointer">O ELEGIR ARCHIVO .JSON<input type="file" accept="application/json,.json" style="display:none" data-json></label></div>' +
    ((S.syncBusy || st) ? '<p class="' + cls + '">' + (S.syncBusy ? "Trabajando con el backend…" : esc(st)) + "</p>" : "") +
    "</div>";
}

/* ============ RENDER ============ */

function render() {
  var root = document.documentElement.style;
  root.setProperty("--pri", S.site.theme.primary);
  root.setProperty("--ink", S.site.theme.ink || "#2A1B12");
  root.setProperty("--bg", S.site.theme.bg);
  var main = "";
  if (S.view === "servicios") main = viewHome();
  else if (S.view === "trabajos") main = viewTrabajos();
  else if (S.view === "sobre") main = viewSobre();
  else if (S.view === "contacto") main = viewContacto();
  else if (S.view === "reservas") main = viewReservas(false);
  else if (S.view === "reservar") main = viewBooking();
  else if (S.view === "editar") main = viewEditar();
  app.innerHTML = renderHeader() +
    '<main class="wrap">' + main + "</main>" +
    '<a class="fab" href="' + waLink() + '" target="_blank" rel="noreferrer" aria-label="WhatsApp">' + IC.wa + "</a>";
  window.scrollTo(0, 0);
}

/* ============ ACCIONES ============ */

var _armTimer = null;
function arm(key, del) {
  if (S.arm === key) { S.arm = null; del(); }
  else {
    S.arm = key;
    if (_armTimer) clearTimeout(_armTimer);
    _armTimer = setTimeout(function(){ if (S.arm) { S.arm = null; render(); } }, 3000);
  }
  render();
}

function findCat(id) { for (var i = 0; i < S.site.catalog.length; i++) if (S.site.catalog[i].id === id) return i; return -1; }

var ACT = {
  go: function(d) { S.view = d.view; render(); },
  reservar: function() {
    S.book = { step:1, catId:null, svcId:null, dateKey:null, time:null, name:"", phone:"", phone2:"", ig:"", done:null };
    S.view = "reservar"; render();
  },
  pickcat: function(d) { S.book.catId = d.cat || null; S.book.svcId = null; render(); },
  picksvc: function(d) { S.book.svcId = d.svc; render(); },
  bkstep: function(d) { S.book.step = Number(d.step); render(); },
  bkback: function() { S.book.step -= 1; if (S.book.step === 1) S.book.svcId = null; render(); },
  calmove: function(d) { S.calOff += Number(d.d); render(); },
  picksday: function(d) { S.book.dateKey = d.key; S.book.time = null; render(); },
  pickslot: function(d) { S.book.time = d.t; render(); },
  confirm: function() {
    var b = S.book;
    var ci = findCat(b.catId);
    var cat = S.site.catalog[ci];
    var svc = null;
    cat.services.forEach(function(s){ if (s.id === b.svcId) svc = s; });
    if (!svc) return;
    var row = {
      code: "SM-" + (1000 + Math.floor(Math.random() * 9000)),
      cat: cat.name, service: svc.name, dateKey: b.dateKey, time: b.time,
      name: b.name.trim(), phone: b.phone, ig: b.ig.trim(),
      total: Number(svc.price) || 0, sena: senaOf(svc.price), status: "Confirmada"
    };
    S.rows.unshift(row);
    persist();
    apiPushReserva(row);
    b.done = row;
    render();
  },
  "success-done": function(d) { S.book = null; S.view = d.view; render(); },
  cancelres: function(d) {
    S.rows.forEach(function(r){ if (r.code === d.code) r.status = "Cancelada"; });
    persist(); render();
  },
  delres: function(d) { arm("res:" + d.code, function(){ S.rows = S.rows.filter(function(r){ return r.code !== d.code; }); persist(); }); },
  edtab: function(d) { S.editTab = d.tab; S.arm = null; render(); },
  addcat: function() {
    S.site.catalog.push({ id: uid(), name: "Nueva categoría", tag: "Descripción corta", services: [] });
    persist(); render();
  },
  delcat: function(d) { arm("cat:" + d.key, function(){ S.site.catalog.splice(findCat(d.key), 1); persist(); }); },
  addsvc: function(d) {
    var i = findCat(d.cat);
    S.site.catalog[i].services.push({ id: uid(), name: "Nuevo servicio", dur: 45, price: 10000, desc: "Descripción del servicio." });
    persist(); render();
  },
  delsvc: function(d) {
    arm("svc:" + d.key, function() {
      var parts = d.key.split("|"), i = findCat(parts[0]);
      var svcs = S.site.catalog[i].services;
      svcs.splice(svcs.indexOf(svcs.filter(function(s){ return s.id === parts[1]; })[0]), 1);
      persist();
    });
  },
  addwork: function() {
    S.site.works.push({ id: uid(), label: "Nuevo trabajo", sub: "Descripción del look", hues: ["#3E2B22","#8A5A44","#DDB9A3"], photo: null });
    persist(); render();
  },
  delwork: function(d) {
    arm("work:" + d.key, function(){
      S.site.works = S.site.works.filter(function(w){ return w.id !== d.key; });
      persist();
    });
  },
  delfoto: function(d) { setPath(d.bind, null); persist(); render(); },
  palette: function(d) { S.site.theme.primary = d.p; S.site.theme.bg = d.b; persist(); render(); },
  export: function() {
    var data = JSON.stringify({ site: S.site, reservas: S.rows }, null, 2);
    try {
      var blob = new Blob([data], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "sofy-makeup-backup.json";
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function(){ URL.revokeObjectURL(a.href); }, 2000);
    } catch (e) {}
    S.paste = data;
    S.syncStatus = "Copia el JSON de abajo como respaldo (también se intentó descargar).";
    render();
  },
  import: function() {
    try {
      var p = JSON.parse(S.paste);
      if (!p.site) throw new Error("falta 'site'");
      S.site = Object.assign(clone(DEFAULT_SITE), p.site);
      if (Array.isArray(p.reservas)) S.rows = p.reservas;
      persist();
      S.paste = "";
      S.syncStatus = "✅ Contenido importado.";
    } catch (e) {
      S.syncStatus = "❌ JSON inválido: " + e.message;
    }
    render();
  },
  pull: function() {
    var ep = S.site.sync.endpoint;
    if (!ep) { S.syncStatus = "Primero configurá la URL del backend."; render(); return; }
    S.syncBusy = true; render();
    apiPull(ep).then(function(r) {
      S.site = Object.assign(clone(DEFAULT_SITE), r.config);
      if (Array.isArray(r.reservas)) S.rows = r.reservas;
      persist();
      S.syncStatus = "✅ Datos descargados del backend.";
    }).catch(function(e) {
      S.syncStatus = "❌ No se pudo conectar: " + e.message;
    }).then(function() { S.syncBusy = false; render(); });
  },
  push: function() {
    var ep = S.site.sync.endpoint;
    if (!ep) { S.syncStatus = "Primero configurá la URL del backend."; render(); return; }
    S.syncBusy = true; render();
    apiPush(ep, S.site, S.rows).then(function() {
      S.syncStatus = "✅ Datos subidos al backend.";
    }).catch(function(e) {
      S.syncStatus = "❌ No se pudo subir: " + e.message;
    }).then(function() { S.syncBusy = false; render(); });
  }
};

document.addEventListener("click", function(e) {
  var el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  var fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el);
});

/* guardado diferido: evita serializar fotos grandes en cada tecla */
var _persistTimer = null;
function persistSoon() {
  if (_persistTimer) clearTimeout(_persistTimer);
  _persistTimer = setTimeout(persist, 400);
}

/* inputs de texto: actualizan el modelo sin re-render (conserva el foco) */
document.addEventListener("input", function(e) {
  var el = e.target;
  if (el.dataset.bind) {
    setPath(el.dataset.bind, el.type === "checkbox" ? el.checked : el.value);
    persistSoon();
  } else if (el.dataset.paste !== undefined && el.tagName === "TEXTAREA") {
    S.paste = el.value;
  }
});

document.addEventListener("change", function(e) {
  var el = e.target;
  if (el.dataset.bindColor) {
    setPath(el.dataset.bindColor, el.value);
    persist(); render();
  } else if (el.dataset.bind && el.type === "checkbox") {
    setPath(el.dataset.bind, el.checked);
    persist();
  } else if (el.dataset.bind && el.type === "color") {
    setPath(el.dataset.bind, el.value);
    persist();
  } else if (el.dataset.photo) {
    var f = el.files && el.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function() {
      var img = new Image();
      img.onload = function() {
        var scale = Math.min(1, 900 / Math.max(img.width, img.height));
        var c = document.createElement("canvas");
        c.width = Math.round(img.width * scale);
        c.height = Math.round(img.height * scale);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        setPath(el.dataset.photo, c.toDataURL("image/jpeg", 0.8));
        persist(); render();
      };
      img.src = String(fr.result);
    };
    fr.readAsDataURL(f);
  } else if (el.dataset.json !== undefined && el.tagName === "INPUT" && el.type === "file") {
    var jf = el.files && el.files[0];
    if (!jf) return;
    var jfr = new FileReader();
    jfr.onload = function() {
      S.paste = String(jfr.result);
      ACT.import();
    };
    jfr.readAsText(jf);
  }
});

/* ============ ARRANQUE ============ */

(function init() {
  var ep = S.site.sync.endpoint;
  if (ep && S.site.sync.autoSync) {
    apiPull(ep).then(function(r) {
      S.site = Object.assign(clone(DEFAULT_SITE), r.config);
      if (Array.isArray(r.reservas)) S.rows = r.reservas;
      persist();
    }).catch(function(){}).then(render);
  }
  render();
})();
</script>
